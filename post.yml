name: Пост в канал

on:
  schedule:
    # Каждый час с 06:07 до 01:07 по Москве (время в cron — UTC, Москва = UTC+3)
    - cron: "7 3-22 * * *"
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write # чтобы сохранять state.json (список опубликованного)

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сделать и опубликовать пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          POST_MODE: ${{ vars.POST_MODE }}
        run: python main.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Сохранить список опубликованного
        if: always()
        run: |
          git config user.name "poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Обновлён список постов" && git pull --rebase && git push)
